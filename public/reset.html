<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>影迹正在刷新</title>
    <style>
      :root {
        color: #2b1722;
        background: #fff2f7;
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 14px;
        width: min(420px, 100%);
        padding: 24px;
        border: 1px solid #ead1dd;
        border-radius: 8px;
        background: #fffafb;
        box-shadow: 0 20px 60px rgba(78, 18, 48, 0.1);
      }

      strong {
        color: #c2186a;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: #725364;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>正在刷新影迹</strong>
      <p>正在清理旧的手机缓存，完成后会自动回到首页。</p>
    </main>
    <script>
      async function resetAppCache() {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } finally {
          window.location.replace("/?fresh=" + Date.now());
        }
      }

      resetAppCache();
    </script>
  </body>
</html>
